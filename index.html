
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>USURE — Request System</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#080808;
    color:#e7e7e7;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    padding:32px 18px;
}

.wrapper{
    width:100%;
    max-width:1050px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:18px 22px;
    margin-bottom:18px;
    border:1px solid #242424;
    background:#101010;
    border-radius:10px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #444;
    border-radius:7px;
    background:#181818;
    font-weight:800;
    font-size:15px;
}

.brand-text{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.brand-title{
    font-size:16px;
    font-weight:700;
    letter-spacing:1.5px;
}

.brand-subtitle{
    color:#707070;
    font-size:11px;
    letter-spacing:1.2px;
}

.back{
    text-decoration:none;
    color:#bdbdbd;
    border:1px solid #303030;
    background:#161616;
    padding:10px 15px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.7px;
    transition:.15s;
}

.back:hover{
    color:#fff;
    border-color:#555;
    background:#1d1d1d;
}

.panel{
    border:1px solid #242424;
    background:#101010;
    border-radius:10px;
    overflow:hidden;
}

.panel-head{
    padding:22px;
    border-bottom:1px solid #242424;
}

.panel-title{
    font-size:21px;
    font-weight:700;
    letter-spacing:.3px;
}

.panel-description{
    margin-top:7px;
    color:#777;
    font-size:13px;
}

.editor{
    padding:20px;
}

textarea{
    width:100%;
    min-height:430px;
    resize:vertical;
    display:block;
    padding:17px;
    border:1px solid #292929;
    border-radius:7px;
    outline:none;
    background:#090909;
    color:#dcdcdc;
    font-family:Consolas,Monaco,monospace;
    font-size:13px;
    line-height:1.6;
    tab-size:4;
    transition:border-color .15s,background .15s;
}

textarea:focus{
    border-color:#4a4a4a;
    background:#0b0b0b;
}

textarea::placeholder{
    color:#4e4e4e;
}

.editor-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    color:#686868;
    font-size:11px;
}

.actions{
    display:flex;
    gap:9px;
    margin-top:17px;
}

button{
    border:1px solid #303030;
    border-radius:6px;
    background:#171717;
    color:#cfcfcf;
    padding:11px 17px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.6px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    background:#202020;
    border-color:#4a4a4a;
    color:#fff;
}

button.primary{
    background:#e5e5e5;
    color:#080808;
    border-color:#e5e5e5;
}

button.primary:hover{
    background:#fff;
    border-color:#fff;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px 14px;
    border-radius:6px;
    border:1px solid #292929;
    background:#0b0b0b;
    color:#999;
    font-size:12px;
}

.status.show{
    display:block;
}

.status.error{
    color:#d5d5d5;
    border-color:#4a2929;
    background:#120b0b;
}

.result{
    display:none;
    margin-top:18px;
    border:1px solid #292929;
    border-radius:8px;
    background:#0c0c0c;
    overflow:hidden;
}

.result.show{
    display:block;
}

.result-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:15px 17px;
    border-bottom:1px solid #252525;
}

.result-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:.8px;
}

.result-badge{
    padding:5px 8px;
    border:1px solid #333;
    border-radius:4px;
    color:#999;
    font-size:10px;
    letter-spacing:.8px;
}

.result-body{
    padding:17px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:15px;
}

.info-box{
    border:1px solid #222;
    background:#111;
    padding:11px 12px;
    border-radius:5px;
}

.info-label{
    color:#5f5f5f;
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.info-value{
    margin-top:5px;
    color:#cfcfcf;
    font-family:Consolas,monospace;
    font-size:12px;
    word-break:break-all;
}

.loader{
    width:100%;
    min-height:155px;
    padding:15px;
    border:1px solid #242424;
    border-radius:6px;
    background:#080808;
    color:#cfcfcf;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow:auto;
}

.result-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.footer{
    text-align:center;
    color:#454545;
    font-size:10px;
    letter-spacing:1px;
    padding:18px 0 4px;
}

@media(max-width:700px){
    body{
        padding:15px 10px;
    }

    .topbar{
        padding:15px;
    }

    .brand-subtitle{
        display:none;
    }

    .back{
        padding:9px 11px;
    }

    .panel-head{
        padding:18px;
    }

    .editor{
        padding:14px;
    }

    textarea{
        min-height:350px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-wrap:wrap;
    }

    button{
        flex:1;
    }
}
</style>
</head>
<body>

<div class="wrapper">

    <div class="topbar">
        <div class="brand">
            <div class="logo">U</div>
            <div class="brand-text">
                <div class="brand-title">USURE</div>
                <div class="brand-subtitle">REQUEST SYSTEM</div>
            </div>
        </div>

        <a class="back" href="https://nfdjiw2i.github.io/usuremain/">
            BACK TO MAIN
        </a>
    </div>

    <div class="panel">

        <div class="panel-head">
            <div class="panel-title">Create Request</div>
            <div class="panel-description">
                Upload Lua code and generate a unique request loader.
            </div>
        </div>

        <div class="editor">

            <textarea id="code" spellcheck="false" placeholder="Paste your Lua code here..."></textarea>

            <div class="editor-info">
                <span id="lineCount">0 lines</span>
                <span id="byteCount">0 bytes</span>
            </div>

            <div class="actions">
                <button class="primary" id="createBtn">CREATE REQUEST</button>
                <button id="clearBtn">CLEAR</button>
            </div>

            <div class="status" id="status"></div>

            <div class="result" id="result">

                <div class="result-head">
                    <div class="result-title">REQUEST CREATED</div>
                    <div class="result-badge">ACTIVE</div>
                </div>

                <div class="result-body">

                    <div class="info-grid">

                        <div class="info-box">
                            <div class="info-label">Request ID</div>
                            <div class="info-value" id="requestId">—</div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Lines</div>
                            <div class="info-value" id="requestLines">—</div>
                        </div>

                        <div class="info-box">
                            <div class="info-label">Size</div>
                            <div class="info-value" id="requestSize">—</div>
                        </div>

                    </div>

                    <div class="loader" id="loader"></div>

                    <div class="result-actions">
                        <button id="copyBtn">COPY LOADER</button>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        USURE REQUEST SYSTEM
    </div>

</div>

<script>
const API_URL = "https://usure.lvlyvcbcla.workers.dev/create";

const code = document.getElementById("code");
const createBtn = document.getElementById("createBtn");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");

const lineCount = document.getElementById("lineCount");
const byteCount = document.getElementById("byteCount");

const status = document.getElementById("status");
const result = document.getElementById("result");

const requestId = document.getElementById("requestId");
const requestLines = document.getElementById("requestLines");
const requestSize = document.getElementById("requestSize");
const loader = document.getElementById("loader");

function updateStats(){
    const value = code.value;

    const lines = value.length
        ? value.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").length
        : 0;

    const bytes = new TextEncoder().encode(value).length;

    lineCount.textContent =
        `${lines} ${lines === 1 ? "line" : "lines"}`;

    byteCount.textContent =
        `${bytes.toLocaleString()} bytes`;
}

function showStatus(message,error=false){
    status.textContent = message;
    status.className = "status show" + (error ? " error" : "");
}

function hideStatus(){
    status.className = "status";
}

function hideResult(){
    result.classList.remove("show");
}

function formatBytes(bytes){
    if(bytes < 1024){
        return `${bytes} B`;
    }

    if(bytes < 1024 * 1024){
        return `${(bytes / 1024).toFixed(2)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}

code.addEventListener("input",updateStats);

code.addEventListener("keydown",event=>{
    if(event.key === "Tab"){
        event.preventDefault();

        const start = code.selectionStart;
        const end = code.selectionEnd;

        code.value =
            code.value.substring(0,start) +
            "    " +
            code.value.substring(end);

        code.selectionStart = code.selectionEnd = start + 4;

        updateStats();
    }
});

createBtn.addEventListener("click",async()=>{
    const source = code.value;

    if(!source.trim()){
        showStatus("Code is empty.",true);
        return;
    }

    createBtn.disabled = true;
    hideResult();
    showStatus("Creating request...");

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                code:source
            })
        });

        const data = await response.json().catch(()=>{
            return {};
        });

        if(!response.ok || !data.success){
            throw new Error(
                data.error ||
                `Request failed with status ${response.status}`
            );
        }

        requestId.textContent = data.id || "—";
        requestLines.textContent =
            typeof data.lineCount === "number"
                ? data.lineCount.toLocaleString()
                : "—";

        requestSize.textContent =
            typeof data.size === "number"
                ? formatBytes(data.size)
                : "—";

        loader.textContent = data.loader || "";

        result.classList.add("show");

        showStatus("Request created successfully.");

        result.scrollIntoView({
            behavior:"smooth",
            block:"nearest"
        });

    }catch(error){
        showStatus(
            error instanceof Error
                ? error.message
                : String(error),
            true
        );
    }finally{
        createBtn.disabled = false;
    }
});

clearBtn.addEventListener("click",()=>{
    code.value = "";
    hideStatus();
    hideResult();
    updateStats();
    code.focus();
});

copyBtn.addEventListener("click",async()=>{
    const value = loader.textContent;

    if(!value){
        return;
    }

    try{
        await navigator.clipboard.writeText(value);

        const oldText = copyBtn.textContent;
        copyBtn.textContent = "COPIED";

        setTimeout(()=>{
            copyBtn.textContent = oldText;
        },1200);

    }catch{
        const area = document.createElement("textarea");
        area.value = value;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();

        const oldText = copyBtn.textContent;
        copyBtn.textContent = "COPIED";

        setTimeout(()=>{
            copyBtn.textContent = oldText;
        },1200);
    }
});

updateStats();
</script>

</body>
</html>
