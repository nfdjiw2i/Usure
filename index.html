<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USURE Obfuscator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #070707;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 40px 20px;
}

.container {
    width: min(1100px, 100%);
    margin: 0 auto;
}

.header {
    margin-bottom: 30px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 5px;
}

.subtitle {
    margin-top: 8px;
    color: #777777;
    font-size: 13px;
    letter-spacing: 1px;
}

.panel {
    background: #0d0d0d;
    border: 1px solid #202020;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

.label {
    display: block;
    margin-bottom: 10px;
    color: #a0a0a0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

textarea {
    width: 100%;
    min-height: 430px;
    resize: vertical;
    border: 1px solid #242424;
    border-radius: 9px;
    outline: none;
    padding: 18px;
    background: #080808;
    color: #eeeeee;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.55;
    transition: .2s;
}

textarea:focus {
    border-color: #444444;
    box-shadow: 0 0 0 2px rgba(255,255,255,.025);
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    border: 1px solid #303030;
    border-radius: 8px;
    padding: 12px 20px;
    background: #151515;
    color: #eeeeee;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: .18s;
}

button:hover {
    background: #202020;
    border-color: #444444;
}

button:active {
    transform: scale(.98);
}

.primary {
    background: #eeeeee;
    color: #080808;
    border-color: #eeeeee;
}

.primary:hover {
    background: #d5d5d5;
    border-color: #d5d5d5;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 12px 14px;
    border: 1px solid #242424;
    border-radius: 8px;
    background: #101010;
    color: #9d9d9d;
    font-size: 13px;
}

.status.show {
    display: block;
}

.status.success {
    color: #cfcfcf;
}

.status.error {
    color: #ff8585;
    border-color: #402020;
    background: #140b0b;
}

.output {
    display: none;
    margin-top: 20px;
}

.output.show {
    display: block;
}

.output textarea {
    min-height: 300px;
}

.output-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 10px;
}

.output-title {
    color: #a0a0a0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.copy {
    padding: 8px 14px;
    font-size: 12px;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.info-box {
    padding: 14px;
    border: 1px solid #1d1d1d;
    border-radius: 8px;
    background: #0a0a0a;
}

.info-title {
    color: #666666;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.info-value {
    margin-top: 6px;
    color: #d8d8d8;
    font-size: 13px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #444444;
    font-size: 11px;
    letter-spacing: 1px;
}

@media (max-width: 700px) {
    body {
        padding: 20px 12px;
    }

    .panel {
        padding: 14px;
    }

    .logo {
        font-size: 24px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    textarea {
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">USURE</div>
        <div class="subtitle">SECURE SCRIPT DELIVERY SYSTEM</div>
    </div>

    <div class="panel">

        <label class="label">Lua Source</label>

        <textarea
            id="source"
            spellcheck="false"
            placeholder="Вставьте Lua код сюда..."
        ></textarea>

        <div class="actions">
            <button
                class="primary"
                id="generate"
                onclick="generateScript()"
            >
                GENERATE
            </button>

            <button onclick="clearAll()">
                CLEAR
            </button>
        </div>

        <div
            id="status"
            class="status"
        ></div>

        <div
            id="output"
            class="output"
        >

            <div class="output-head">

                <div class="output-title">
                    Generated LocalScript
                </div>

                <button
                    class="copy"
                    onclick="copyResult()"
                >
                    COPY
                </button>

            </div>

            <textarea
                id="result"
                readonly
                spellcheck="false"
            ></textarea>

        </div>

        <div class="info">

            <div class="info-box">
                <div class="info-title">
                    Creator
                </div>

                <div class="info-value">
                    Worker #1
                </div>
            </div>

            <div class="info-box">
                <div class="info-title">
                    Delivery
                </div>

                <div class="info-value">
                    Worker #2
                </div>
            </div>

            <div class="info-box">
                <div class="info-title">
                    Storage
                </div>

                <div class="info-value">
                    Firebase
                </div>
            </div>

        </div>

    </div>

    <div class="footer">
        USURE // PRIVATE CODE DELIVERY
    </div>

</div>

<script>

const CREATOR_WORKER =
    "https://noisy-meadow-1f83.lvlyvcbcla.workers.dev";

const ATTACHER_WORKER =
    "https://bold-darkness-4fdd.lvlyvcbcla.workers.dev";

async function generateScript() {

    const source =
        document.getElementById("source").value;

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    const output =
        document.getElementById("output");

    const button =
        document.getElementById("generate");

    if (!source.trim()) {

        showStatus(
            "Вставьте Lua код.",
            true
        );

        return;
    }

    button.disabled = true;

    button.textContent = "GENERATING...";

    output.classList.remove("show");

    showStatus(
        "Создание защищённого скрипта...",
        false
    );

    try {

        const response = await fetch(
            CREATOR_WORKER + "/create",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    code: source
                })
            }
        );

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error(
                "Worker вернул некорректный ответ."
            );
        }

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                data.details ||
                "Worker error " + response.status
            );
        }

        if (!data.code) {
            throw new Error(
                "Worker не вернул LocalScript."
            );
        }

        result.value = data.code;

        output.classList.add("show");

        showStatus(
            "Готово. LocalScript создан.",
            false,
            true
        );

    } catch (error) {

        console.error(error);

        showStatus(
            error.message ||
            "Ошибка соединения с Worker.",
            true
        );

    } finally {

        button.disabled = false;

        button.textContent = "GENERATE";
    }
}

function showStatus(
    message,
    error = false,
    success = false
) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.classList.add("show");

    status.classList.toggle(
        "error",
        error
    );

    status.classList.toggle(
        "success",
        success
    );
}

async function copyResult() {

    const result =
        document.getElementById("result");

    if (!result.value) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            result.value
        );

        showStatus(
            "LocalScript скопирован.",
            false,
            true
        );

    } catch {

        result.select();

        document.execCommand("copy");

        showStatus(
            "LocalScript скопирован.",
            false,
            true
        );
    }
}

function clearAll() {

    document.getElementById("source").value = "";

    document.getElementById("result").value = "";

    document.getElementById("output")
        .classList.remove("show");

    document.getElementById("status")
        .classList.remove("show");
}

</script>

</body>
</html>
